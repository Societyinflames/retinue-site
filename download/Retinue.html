<title>Retinue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Retinue game loader. Publish this file as an artifact with these capabilities: sample, db, user, assets.
     The game itself loads from npm (retinue-engine 1.0.2); everything it saves stays in this artifact. -->
<div id="retinue-boot" style="font:15px/1.5 Georgia,serif;color:#d8d2c6;background:#0e0f11;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
<div style="max-width:30em"><p>Loading the game…</p>
<p id="retinue-slow" hidden style="color:#a9a397">Still loading? The game engine (retinue-engine 1.0.2) hasn't arrived. Check this page's engine version matches the one you were sent and was published at least two weeks ago, and that the page was published unchanged. Then reopen it.</p></div></div>
<script>setTimeout(function(){var s=document.getElementById("retinue-slow");if(s)s.hidden=false;},15000);</script>
<script>window.RETINUE_CONFIG={lean:true,hideArtTools:true,packPrompt:false};</script>
<script src="https://cdn.jsdelivr.net/npm/retinue-engine@1.0.2/dist/engine.min.js"></script>
